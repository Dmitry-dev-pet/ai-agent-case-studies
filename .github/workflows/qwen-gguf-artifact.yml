name: One-time Qwen GGUF handoff

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/qwen-gguf-artifact.yml"

permissions:
  contents: read

jobs:
  download-verified-gguf:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve immutable Hugging Face revision, download and fingerprint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p handoff
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          from urllib.request import Request, urlopen

          repo = "notschmee/Qwen3.5-0.8B-GGUF"
          filename = "Qwen3.5-0.8B-Q4_K_M.gguf"
          name = Path("handoff") / filename
          req = Request(
              f"https://huggingface.co/api/models/{repo}",
              headers={"User-Agent": "qwen-gguf-once/1.0"},
          )
          with urlopen(req, timeout=45) as response:
              metadata = json.load(response)
          revision = metadata.get("sha", "")
          if not re.fullmatch(r"[0-9a-f]{40}", revision):
              raise ValueError("Model repository did not return an immutable revision")
          url = f"https://huggingface.co/{repo}/resolve/{revision}/{filename}"
          subprocess.run(
              [
                  "curl", "--fail", "--location", "--show-error", "--silent",
                  "--retry", "4", "--retry-all-errors", "--retry-delay", "3",
                  "--connect-timeout", "30", "--max-time", "1100",
                  "--output", str(name), url,
              ],
              check=True,
          )
          size = name.stat().st_size
          if not 450_000_000 <= size <= 700_000_000:
              raise ValueError(f"Unexpected model size: {size}")
          with name.open("rb") as f:
              if f.read(4) != b"GGUF":
                  raise ValueError("Invalid GGUF header")
              f.seek(0)
              checksum = hashlib.file_digest(f, "sha256").hexdigest()
          manifest = {
              "filename": filename,
              "source_repo": repo,
              "source_revision": revision,
              "size_bytes": size,
              "sha256": checksum,
              "format": "GGUF",
              "model": "Qwen3.5-0.8B",
              "quantization": "Q4_K_M",
          }
          Path("handoff/manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(manifest, sort_keys=True))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(
                  f"## Pinned public Qwen GGUF\n\n"
                  f"- Revision: `{revision}`\n"
                  f"- Size: {size} bytes\n"
                  f"- SHA-256: `{checksum}`\n"
                  f"- Delivery: Actions artifact, retention 1 day, no Mac\n"
              )
          PY

      - name: Upload only the model and integrity manifest
        uses: actions/upload-artifact@v4
        with:
          name: qwen35-0p8b-q4km-gguf-one-shot
          path: handoff/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
